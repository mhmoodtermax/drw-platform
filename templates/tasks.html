<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المهام</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(#ead7ef,#a7c7e8);
    padding-bottom:90px;
}

.container{
    max-width:420px;
    margin:auto;
    padding:15px;
}

/* top */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.logo{
    font-size:26px;
    font-weight:bold;
}

.lang{
    background:white;
    padding:10px 18px;
    border-radius:20px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

/* timer */
.timer{
    background:linear-gradient(90deg,#74efd5,#92a8ff);
    border-radius:18px;
    padding:20px;
    text-align:center;
    font-size:22px;
    margin-bottom:20px;
}

/* stats */
.stats{
    background:#f3f3f3;
    border-radius:20px;
    padding:20px;
    display:flex;
    justify-content:space-around;
    text-align:center;
    margin-bottom:25px;
}

.num{
    font-size:40px;
    margin-top:10px;
}

/* tabs */
.tabs{
    display:flex;
    background:#eee;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:25px;
}

.tab{
    flex:1;
    text-align:center;
    padding:18px;
    font-size:22px;
}

.active{
    background:#b57d8c;
    color:black;
    font-weight:bold;
}

/* product card */
.product{
    background:#f3f3f3;
    border-radius:22px;
    padding:18px;
}

.product-inner{
    display:flex;
    gap:15px;
}

.product img{
    width:140px;
    border-radius:12px;
}

.info{
    flex:1;
}

.title{
    font-size:22px;
    margin-bottom:20px;
}

.small{
    color:#888;
    margin-top:10px;
}

.price{
    float:left;
    font-size:22px;
    color:black;
}

.complete{
    margin-top:20px;
    background:#b57d8c;
    color:black;
    border:none;
    padding:12px 35px;
    border-radius:18px;
    font-size:24px;
    float:left;
}

/* bottom nav */
.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#efefef;
    display:flex;
    justify-content:space-around;
    padding:12px;
    border-top-left-radius:25px;
    border-top-right-radius:25px;
}

.bottom a{
    text-decoration:none;
    color:#888;
    text-align:center;
    font-size:13px;
}

.active-nav{
    color:black !important;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

    <!-- header -->
    <div class="header">

        <div class="logo">OpenClaw</div>

        <div class="lang">
            🌐 عربي
        </div>

    </div>

    <!-- timer -->
    <div class="timer">
        ☀ إعادة تعيين المهمة:
        12:29:13
    </div>

    <!-- stats -->
    <div class="stats">

        <div>
            <div>المهام المتبقية اليوم</div>
            <div class="num">1</div>
        </div>

        <div>
            <div>جميع المهام لهذا اليوم</div>
            <div class="num">1</div>
        </div>

    </div>

    <!-- tabs -->
    <div class="tabs">

        <div class="tab active">
            في تقدم
        </div>

        <div class="tab">
            مكتمل
        </div>

    </div>

    <!-- product -->
    <div class="product">

        <div class="product-inner">

            <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?q=80&w=800&auto=format&fit=crop">

            <div class="info">

                <div class="title">
                    [xiaybeibei] Newborn Hat Baby Cute Hats
                </div>

                <div class="small">
                    سعر
                    <span class="price">1.50</span>
                </div>

                <div class="small">
                    دخل
                    <span class="price">1.50</span>
                </div>

            </div>

        </div>

        <button class="complete">
            إكمال
        </button>

        <div style="clear:both;"></div>

    </div>

</div>

<!-- bottom -->
<div class="bottom">

    <a href="/">🏠<br>بيت</a>

    <a class="active-nav" href="/tasks">
        📅<br>مهمة
    </a>

    <a href="/team">
        🏆<br>فريق
    </a>

    <a href="#">
        👑<br>كبار الشخصيات
    </a>

    <a href="#">
        👤<br>أنا
    </a>

</div>

</body>
</html>
