<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إيداع</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f111a;
    color:white;
}

/* back */
.back{
    position:fixed;
    top:12px;
    left:12px;
    background:#00d4ff;
    color:black;
    padding:6px 10px;
    border-radius:10px;
    text-decoration:none;
    font-size:12px;
    font-weight:bold;
}

/* container */
.container{
    max-width:420px;
    margin:auto;
    padding:15px;
}

.title{
    text-align:center;
    font-size:20px;
    margin-top:40px;
    font-weight:bold;
    color:#00d4ff;
}

/* card */
.card{
    background:#1b1f2e;
    padding:15px;
    border-radius:15px;
}

/* row */
.row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid #222;
    font-size:13px;
}

/* wallet box */
.wallet{
    background:#0f111a;
    border:1px solid #00d4ff;
    padding:10px;
    border-radius:10px;
    font-size:12px;
    word-break:break-all;
    color:#00d4ff;
}

/* button */
button{
    width:100%;
    padding:11px;
    margin-top:12px;
    border:none;
    border-radius:12px;
    font-size:14px;
    cursor:pointer;
    background:#00d4ff;
    color:black;
    font-weight:bold;
}

/* small text */
.small{
    font-size:12px;
    color:#aaa;
    margin-top:10px;
    line-height:1.6;
}

/* ===== TOAST ===== */
#toast{
    position:fixed;
    bottom:80px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.85);
    color:#00d4ff;
    padding:12px 18px;
    border-radius:14px;
    font-size:13px;
    display:none;
    border:1px solid #00d4ff;
    box-shadow:0 0 15px rgba(0,212,255,0.3);
    display:flex;
    align-items:center;
    gap:8px;
    animation:fadeIn 0.3s ease;
}

#toast i{
    color:#00d4ff;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateX(-50%) translateY(10px);}
    to{opacity:1; transform:translateX(-50%) translateY(0);}
}
</style>

<!-- Font Awesome للأيقونة -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<a class="back" href="/">⬅ رجوع</a>

<div class="container">

    <div class="title">💰 إيداع USDT</div>

    <div class="card">

        <div class="row">
            <span>📌 الشبكة</span>
            <span>TRC20</span>
        </div>

        <div class="row">
            <span>📍 عنوان الإيداع</span>
        </div>

        <!-- wallet address -->
        <div class="wallet">
            TPpBXMa6s9XEQxfwjvDikeMY9sdEEpe2MD
        </div>

        <div class="row">
            <span>⚠ مهم</span>
            <span>انسخ العنوان بدقة</span>
        </div>

        <button onclick="copyAddress()">📋 نسخ العنوان</button>

        <div class="small">
            ⚠ أرسل USDT فقط على شبكة TRC20<br>
            ⚠ أي شبكة أخرى قد تفقد الأموال<br>
            ⚠ الإيداع يتم خلال دقائق
        </div>

    </div>

</div>

<!-- toast -->
<div id="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastText">تم النسخ</span>
</div>

<!-- صوت -->
<audio id="copySound">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-interface-click-1126.mp3" type="audio/mpeg">
</audio>

<script>
function showToast(msg){
    let t = document.getElementById("toast");
    let text = document.getElementById("toastText");

    text.innerText = msg;
    t.style.display = "flex";

    setTimeout(()=>{
        t.style.display = "none";
    }, 2000);
}

function copyAddress(){
    navigator.clipboard.writeText("TPpBXMa6s9XEQxfwjvDikeMY9sdEEpe2MD");

    // صوت
    let sound = document.getElementById("copySound");
    sound.currentTime = 0;
    sound.play();

    // إشعار
    showToast("تم نسخ العنوان بنجاح");
}
</script>

</body>
</html>
