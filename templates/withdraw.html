<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سحب</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f111a;
    color:white;
}

/* back button */
.back{
    position:fixed;
    top:12px;
    left:12px;
    background:#00d4ff;
    color:black;
    padding:6px 10px;
    border-radius:10px;
    text-decoration:none;
    font-size:12px;
    font-weight:bold;
}

/* container */
.container{
    max-width:420px;
    margin:auto;
    padding:15px;
}

.title{
    text-align:center;
    font-size:20px;
    margin-top:40px;
    font-weight:bold;
    color:#00d4ff;
}

/* coins */
.coins{
    display:flex;
    gap:8px;
    margin:15px 0;
    justify-content:center;
}

.coins img{
    width:28px;
    height:28px;
    border-radius:50%;
}

/* card */
.card{
    background:#1b1f2e;
    padding:15px;
    border-radius:15px;
}

/* rows */
.row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid #222;
    font-size:13px;
}

/* inputs */
input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #333;
    outline:none;
    font-size:13px;
    background:#0f111a;
    color:white;
}

input::placeholder{
    color:#777;
}

/* button */
button{
    width:100%;
    padding:11px;
    margin-top:12px;
    border:none;
    border-radius:12px;
    font-size:14px;
    cursor:pointer;
    background:#00d4ff;
    color:black;
    font-weight:bold;
}

/* small text */
.small{
    font-size:12px;
    color:#aaa;
    margin-top:10px;
    line-height:1.6;
}

/* flash box */
.flash{
    background:#111;
    padding:10px;
    border-radius:12px;
    margin-bottom:10px;
    color:#00d4ff;
    text-align:center;
}

/* toast */
#toast{
    position:fixed;
    bottom:80px;
    left:50%;
    transform:translateX(-50%);
    background:#000;
    color:#00d4ff;
    padding:10px 15px;
    border-radius:12px;
    font-size:13px;
    display:none;
    border:1px solid #00d4ff;
}
</style>
</head>

<body>

<a class="back" href="/">⬅ رجوع</a>

<div class="container">

    <div class="title">💸 سحب</div>

    <div class="card">

        <!-- FLASH MESSAGES -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for msg in messages %}
              <div class="flash">{{ msg }}</div>
              <script>
                showToast("{{ msg }}");
              </script>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- coins -->
        <div class="coins">
            <img src="https://cryptologos.cc/logos/tether-usdt-logo.png">
            <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png">
        </div>

        <div class="row">
            <span>⏱ سحب 24 ساعة</span>
            <span>نشط</span>
        </div>

        <div class="row">
            <span>💰 الرصيد</span>
            <span>{{ balance }}</span>
        </div>

        <div class="row">
            <span>📌 الطريقة</span>
            <span>TRC20</span>
        </div>

        <div class="row">
            <span>📤 سيتم استلام</span>
            <span>{{ balance }}</span>
        </div>

        <form method="POST">

            <input type="number" name="amount" placeholder="المبلغ" required>

            <input type="text" name="address" placeholder="عنوان TRC20" required>

            <input type="password" name="password" placeholder="كلمة المرور" required>

            <button type="submit">✔ تأكيد السحب</button>

        </form>

        <div class="small">
            ⚠ السحب خلال 24 ساعة<br>
            ⚠ تأكد من صحة العنوان<br>
            ⚠ أي خطأ مسؤوليتك
        </div>

    </div>
</div>

<div id="toast"></div>

<script>
function showToast(msg){
    let t = document.getElementById("toast");
    t.innerText = msg;
    t.style.display = "block";

    setTimeout(()=>{
        t.style.display = "none";
    }, 2500);
}
</script>

</body>
</html>
