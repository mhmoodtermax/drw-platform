<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DRW</title>

<link rel="stylesheet" href="/static/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<!-- HEADER -->

<div class="header">

    <div class="left">

        <div class="logo-circle">
            DRW
        </div>

        <div class="logo-text">
            DRW
        </div>

    </div>

    <div class="right">

        <i class="fa-solid fa-comment"></i>

        <i class="fa-solid fa-globe"></i>

    </div>

</div>

<!-- NEWS -->

<div class="news-bar">

    <i class="fa-solid fa-bullhorn"></i>

    <marquee>
        مرحباً {{email}} أهلاً بك في منصة DRW
    </marquee>

</div>

<!-- BANNER -->

<div class="banner">

<img src="https://images.unsplash.com/photo-1642104704074-907c0698cbd9?q=80&w=1200&auto=format&fit=crop">

</div>

<!-- BALANCE -->

<div class="balance-card">

    <div class="balance-item">

        <span>الحساب الكلي</span>

        <h2>{{balance}} USDT</h2>

        <p>≈ ${{balance}}</p>

    </div>

    <div class="balance-item">

        <span>أصول الربح</span>

        <h2>0.00 USDT</h2>

        <p>≈ $0.00</p>

    </div>

</div>

<!-- TELEGRAM -->

<a class="telegram-btn" href="#">
    <i class="fa-brands fa-telegram"></i>
</a>

<!-- BUTTONS -->

<div class="actions">

    <a href="/deposit">
        <div class="circle yellow">
            <i class="fa-solid fa-plus"></i>
        </div>
        <p>تعبئة</p>
    </a>

    <a href="/withdraw">
        <div class="circle yellow">
            <i class="fa-solid fa-minus"></i>
        </div>
        <p>سحب</p>
    </a>

    <a href="/tasks">
        <div class="circle yellow">
            <i class="fa-solid fa-download"></i>
        </div>
        <p>تحميل</p>
    </a>

    <a href="/vip">
        <div class="circle yellow">
            <i class="fa-solid fa-id-card"></i>
        </div>
        <p>معلومات</p>
    </a>

</div>

<!-- BOXES -->

<div class="small-boxes">

    <div class="small-box">
        <i class="fa-solid fa-circle-question"></i>
        <p>المساعدة</p>
    </div>

    <a class="small-box" href="/team">
      <i class="fa-solid fa-users"></i>
      <p>ادعو أصدقاء</p>
    </a>

    <div class="small-box">
        <i class="fa-solid fa-wallet"></i>
        <p>المحفظة</p>
    </div>

</div>

<!-- إشعارات السحب داخل الصفحة -->
<div class="notify-feed" id="notifyFeed"></div>

<!-- BOTTOM -->

<div class="bottom-nav">

    <a class="active" href="/">
        <i class="fa-solid fa-house"></i>
        <span>بيت</span>
    </a>

    <a href="/tasks">
        <i class="fa-solid fa-newspaper"></i>
        <span>أخبار</span>
    </a>

    <a href="/vip">
        <i class="fa-solid fa-cube"></i>
        <span>الكمية</span>
    </a>

    <a href="/team">
        <i class="fa-solid fa-share-nodes"></i>
        <span>الأصدقاء</span>
    </a>

    <a href="/profile">
        <i class="fa-solid fa-user"></i>
        <span>أنا</span>
    </a>

</div>

<style>

/* 🔥 مهم جداً */
body{
    padding-bottom:110px;
}

/* feed داخل الصفحة */
.notify-feed{
    margin:15px;
    background:#1b1f2e;
    border:1px solid #00d4ff;
    border-radius:14px;
    padding:10px;
    color:white;
    font-size:13px;
    min-height:60px;

    position:relative;

    /* خليها تحت الشريط */
    z-index:1;
}

/* bottom nav لازم يكون فوق كل شيء */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;

    z-index:9999;
}

/* item */
.notify-item{
    padding:8px;
    border-bottom:1px solid #222;
    animation:fadeIn 0.4s ease;
    display:flex;
    align-items:center;
    gap:8px;
}

.notify-item:last-child{
    border-bottom:none;
}

.flag{
    font-size:18px;
}

.name{
    color:#00d4ff;
    font-weight:bold;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

</style>

<script>

/* بيانات الدول + أسماء */
const feedData = [
    {flag:"🇸🇾", name:"Ahmed"},
    {flag:"🇸🇦", name:"Khaled"},
    {flag:"🇦🇪", name:"Sarah"},
    {flag:"🇰🇼", name:"Ali"},
    {flag:"🇶🇦", name:"Noor"},
    {flag:"🇴🇲", name:"Mohammed"}
];

const amounts = ["120 USDT","350 USDT","90 USDT","500 USDT","240 USDT","1000 USDT"];

function addFeed(){

    let feed = document.getElementById("notifyFeed");

    let user = feedData[Math.floor(Math.random() * feedData.length)];
    let amount = amounts[Math.floor(Math.random() * amounts.length)];

    let item = document.createElement("div");
    item.className = "notify-item";

    item.innerHTML = `
        <span class="flag">${user.flag}</span>
        <span>🔔</span>
        <span class="name">${user.name}</span>
        <span>سحب ${amount}</span>
    `;

    feed.prepend(item);

    if(feed.children.length > 5){
        feed.removeChild(feed.lastChild);
    }
}

/* كل 4 ثواني */
setInterval(addFeed, 4000);

</script>

</script>

</body>
</html>
