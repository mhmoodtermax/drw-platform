<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#e8d5ef;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:320px;
    background:linear-gradient(135deg,#1c1c2b,#2a1450);
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.5);
}

.title{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin-top:12px;
    font-size:14px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin-top:15px;
    background:#fff;
    color:#000;
    font-size:15px;
    font-weight:bold;
}

.small{
    text-align:center;
    margin-top:15px;
    font-size:12px;
    opacity:0.8;
}

a{
    color:#fff;
}

#toast{
    position:fixed;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    background:#ef4444;
    color:#fff;
    padding:10px 15px;
    border-radius:10px;
    display:none;
    font-size:13px;
}

</style>
</head>

<body>

<div class="box">

    <div class="title">🚀 إنشاء حساب</div>

    <form method="POST" onsubmit="return validateForm()">

        <input type="email"
        name="email"
        id="email"
        placeholder="📧 Gmail">

        <input type="password"
        name="password"
        placeholder="🔒 كلمة المرور">

        <input type="text"
        name="invite"
        placeholder="🎁 كود الدعوة (اختياري)">

        <button type="submit">
            إنشاء حساب
        </button>

    </form>

    <div class="small">
        لديك حساب؟
        <a href="/login">تسجيل دخول</a>
    </div>

</div>

<div id="toast"></div>

<script>

function showToast(msg){
    let t = document.getElementById("toast");

    t.innerText = msg;
    t.style.display = "block";

    setTimeout(()=>{
        t.style.display = "none";
    },2500);
}

function validateForm(){

    let email = document.getElementById("email").value;

    if(!email.endsWith("@gmail.com")){
        showToast("❌ يسمح فقط بحساب Gmail");
        return false;
    }

    return true;
}

</script>

</body>
</html>
